<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori & Genre Anime | Otakux</title>
  <meta name="description" content="Jelajahi ribuan anime berdasarkan genre favorit Anda di Otakux.">
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json?v=otakux_v4">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=x_v4">
  <link rel="apple-touch-icon" href="icons/icon-512.png?v=x_v4">
  <meta name="theme-color" content="#0d0d14">
  <link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="navbar-logo">
        <img src="icons/splash_waifu_transparent.png" alt="Otakux Logo" class="navbar-logo-img">
        <span class="text-gradient">Otakux</span>
      </a>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" class="search-input" id="navbar-search" placeholder="Cari anime..." autocomplete="off">
      </div>
      <nav class="navbar-nav" id="main-nav">
        <a href="index.html">Beranda</a>
        <a href="search.html">Daftar Anime</a>
        <a href="genre.html" class="active">Genre</a>
        <a href="schedule.html">Jadwal</a>
      </nav>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="nav-user-slot"></div>
        <button class="menu-toggle" id="menu-toggle" aria-label="Buka Menu">☰</button>
      </div>
    </div>
  </nav>

  <!-- GENRE HERO -->
  <section class="hero" style="min-height: auto; padding: 40px 0 20px 0;">
    <div class="container">
      <div style="text-align:center; max-width: 680px; margin: 0 auto;">
        <span class="badge" style="background: rgba(124, 58, 237, 0.2); color: #a78bfa; border: 1px solid rgba(124, 58, 237, 0.4); margin-bottom: 12px;">
          🎭 Kategori Lengkap
        </span>
        <h1 class="hero-title" style="font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 10px;">
          Jelajahi Genre Anime
        </h1>
        <p class="hero-desc" id="genre-desc" style="font-size: 0.95rem; margin-bottom: 24px;">
          Pilih genre favorit Anda untuk menemukan rekomendasi anime terbaik dan terpopuler.
        </p>
      </div>

      <!-- GENRE PILL SELECTOR -->
      <div class="genre-pills-wrap" id="genre-pills" role="tablist">
        <div class="spinner" style="margin: 10px auto;"></div>
      </div>
    </div>
  </section>

  <!-- ANIME RESULTS SECTION -->
  <main class="section" style="padding-top: 10px;">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">
          <span class="icon" id="active-genre-icon">⚔️</span>
          <span id="active-genre-title">Anime Action</span>
        </h2>
        <span id="genre-result-count" style="font-size: 0.85rem; color: var(--clr-text-muted);">Memuat...</span>
      </div>

      <div class="anime-grid" id="genre-anime-grid" role="list">
        <div class="spinner" style="margin: 40px auto; grid-column: 1/-1;"></div>
      </div>

      <div id="load-more-wrap" style="text-align: center; margin: 40px 0; display: none;">
        <button id="btn-load-more" type="button" class="btn btn-secondary" style="padding: 10px 32px; border-radius: 30px; font-weight: 600;">
          ➕ Muat Lebih Banyak
        </button>
      </div>
    </div>
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Beranda</span>
    </a>
    <a href="search.html" class="mobile-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span>Cari</span>
    </a>
    <a href="genre.html" class="mobile-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
      <span>Genre</span>
    </a>
    <a href="schedule.html" class="mobile-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      <span>Jadwal</span>
    </a>
    <a href="profile.html" class="mobile-nav-item" id="bottom-nav-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </a>
  </nav>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span class="text-gradient" style="font-weight: 700;">Otakux</span>
        <span style="font-size: 0.8rem; color: var(--clr-text-muted);">© 2026 Otakux. Nonton Anime Sub Indo Terlengkap.</span>
      </div>
    </div>
  </footer>

  <script src="js/auth.js?v=23"></script>
  <script src="js/features.js?v=1"></script>
  <script>
    const API_BASE = window.location.origin && window.location.origin.startsWith("http")
      ? window.location.origin
      : "http://localhost:5000";

    let currentGenre = "Action";
    let currentPage = 1;
    let totalItems = 0;
    let allGenres = [];

    function imgFallback(el) {
      if (el.dataset.fallbackApplied) return;
      el.dataset.fallbackApplied = "true";
      el.src = "icons/default_poster.svg";
    }

    async function fetchApi(endpoint) {
      const res = await fetch(`${API_BASE}${endpoint}`, {
        headers: { 'ngrok-skip-browser-warning': 'true' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      return json.data;
    }

    async function loadGenres() {
      const pillsContainer = document.getElementById("genre-pills");
      try {
        allGenres = await fetchApi("/api/genres");
        const urlParams = new URLSearchParams(window.location.search);
        const paramGenre = urlParams.get("name") || urlParams.get("genre");
        if (paramGenre && allGenres.some(g => g.name.toLowerCase() === paramGenre.toLowerCase())) {
          currentGenre = allGenres.find(g => g.name.toLowerCase() === paramGenre.toLowerCase()).name;
        }

        pillsContainer.innerHTML = allGenres.map(g => `
          <button type="button" class="genre-pill ${g.name === currentGenre ? 'active' : ''}" data-genre="${g.name}" data-icon="${g.icon}" data-desc="${g.desc}">
            <span>${g.icon}</span>
            <span>${g.name}</span>
            <span class="pill-count">${g.count}</span>
          </button>
        `).join("");

        pillsContainer.querySelectorAll(".genre-pill").forEach(btn => {
          btn.addEventListener("click", () => {
            const selected = btn.dataset.genre;
            if (selected === currentGenre) return;
            currentGenre = selected;
            pillsContainer.querySelectorAll(".genre-pill").forEach(b => b.classList.toggle("active", b === btn));
            currentPage = 1;
            loadAnimesByGenre(currentGenre, false);
            const url = new URL(window.location.href);
            url.searchParams.set("name", selected);
            window.history.pushState({}, "", url.toString());
          });
        });

        loadAnimesByGenre(currentGenre, false);
      } catch (err) {
        console.error("Gagal load genres:", err);
        pillsContainer.innerHTML = `<p style="color:var(--clr-error)">Gagal memuat kategori genre.</p>`;
      }
    }

    async function loadAnimesByGenre(genreName, append = false) {
      const grid = document.getElementById("genre-anime-grid");
      const loadMoreWrap = document.getElementById("load-more-wrap");
      const titleEl = document.getElementById("active-genre-title");
      const iconEl = document.getElementById("active-genre-icon");
      const descEl = document.getElementById("genre-desc");
      const countEl = document.getElementById("genre-result-count");

      const genreObj = allGenres.find(g => g.name.toLowerCase() === genreName.toLowerCase());
      if (genreObj) {
        titleEl.textContent = `Anime ${genreObj.name}`;
        iconEl.textContent = genreObj.icon;
        if (genreObj.desc) descEl.textContent = genreObj.desc;
      } else {
        titleEl.textContent = `Anime ${genreName}`;
      }

      if (!append) {
        grid.innerHTML = '<div class="spinner" style="margin: 40px auto; grid-column: 1/-1;"></div>';
      }

      try {
        const data = await fetchApi(`/api/animes/genre/${encodeURIComponent(genreName)}?limit=24&page=${currentPage}`);
        totalItems = data.total;
        countEl.textContent = `Ditemukan ${totalItems} judul`;

        const playableAnimes = (data.animes || []).filter(a => Number(a.ep_count) > 0);
        const cardsHtml = playableAnimes.map(a => `
          <a href="detail.html?slug=${encodeURIComponent(a.slug)}" class="anime-card animate-fade-up">
            <div class="anime-card-thumb">
              <img src="${(a.thumbnail && a.thumbnail.trim()) ? a.thumbnail : 'icons/default_poster.svg'}" alt="${a.title}" loading="lazy" onerror="imgFallback(this)">
              <div class="anime-card-overlay">
                <div class="anime-card-play">▶</div>
              </div>
              <span class="anime-card-ep-badge" style="background:#6c5ce7;color:#fff;font-weight:600;">🟢 ${a.ep_count} Eps</span>
              ${a.score > 0 ? `<span class="anime-card-score">⭐ ${a.score}</span>` : ''}
            </div>
            <div class="anime-card-body">
              <div class="anime-card-title">${a.title}</div>
              <div class="anime-card-genre">${a.genre ? a.genre.split(',').slice(0, 2).join(', ') : 'Anime Series'}</div>
            </div>
          </a>
        `).join("");

        if (append) {
          grid.insertAdjacentHTML("beforeend", cardsHtml);
        } else {
          grid.innerHTML = cardsHtml.length > 0 ? cardsHtml : '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--clr-text-muted)">Belum ada anime untuk genre ini.</p>';
        }

        const loadedCount = currentPage * 24;
        loadMoreWrap.style.display = loadedCount < totalItems ? "block" : "none";
      } catch (e) {
        console.error("Gagal load anime genre:", e);
        if (!append) grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--clr-error)">Terjadi kesalahan saat memuat data anime.</p>`;
      }
    }

    document.getElementById("btn-load-more")?.addEventListener("click", () => {
      currentPage++;
      loadAnimesByGenre(currentGenre, true);
    });

    // Mobile nav toggle
    document.getElementById("menu-toggle")?.addEventListener("click", () => {
      document.getElementById("main-nav")?.classList.toggle("open");
    });

    // Search redirect
    document.getElementById("navbar-search")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.value.trim()) {
        window.location.href = `search.html?q=${encodeURIComponent(e.target.value.trim())}`;
      }
    });

    loadGenres();
  </script>
</body>
</html>
