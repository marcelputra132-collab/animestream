name: Build Otakux APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b182405643d18765195062a0a4d0fe" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

      - name: Build APK with Gradle Wrapper
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/Otakux.apk
          cp app/build/outputs/apk/debug/*.apk ../dist/AnimeStream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otakux-APK
          path: dist/Otakux.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Otakux APK v1.0.${{ github.run_number }} (Direct Download)
          body: |
            ## 📱 Otakux APK Siap Download & Pasang
            Aplikasi resmi Otakux Android dengan Logo "X" & Streaming Direct HD.
            
            ### Cara Pasang di HP / BlueStacks:
            1. Download file **`Otakux.apk`** di bawah ini.
            2. Buka file `.apk` di HP Android / BlueStacks Anda.
            3. Jika muncul peringatan *"Izinkan pemasangan dari sumber ini"*, pilih **Izinkan**.
            4. Klik **Install / Pasang**, lalu buka aplikasi **Otakux**!
          files: |
            dist/Otakux.apk
            dist/AnimeStream.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
