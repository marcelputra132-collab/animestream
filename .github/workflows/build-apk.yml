name: Build AnimeStream APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        working-directory: android_app
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AnimeStream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-APK
          path: android_app/app/build/outputs/apk/debug/AnimeStream.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnimeStream APK v1.0.${{ github.run_number }} (Direct Download)
          body: |
            ## 📱 AnimeStream APK Siap Download & Pasang
            Aplikasi resmi AnimeStream Android (Direct APK).
            
            ### Cara Pasang:
            1. Download file **`AnimeStream.apk`** di bawah ini.
            2. Buka file `.apk` di HP Android Anda.
            3. Jika muncul peringatan *"Izinkan pemasangan dari sumber ini"*, pilih **Izinkan**.
            4. Klik **Install / Pasang**, lalu buka aplikasi!
          files: android_app/app/build/outputs/apk/debug/AnimeStream.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
