name: Build AnimeStream APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android_app/local.properties
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b182405643d18765195062a0a4d0fe" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          yes | sdkmanager --licenses || true

      - name: Generate Wrapper & Build APK
        working-directory: android_app
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/AnimeStream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-APK
          path: dist/AnimeStream.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnimeStream APK v1.0.${{ github.run_number }} (Direct Download)
          body: |
            ## 📱 AnimeStream APK Siap Download & Pasang
            Aplikasi resmi AnimeStream Android (Direct APK).
            
            ### Cara Pasang di HP:
            1. Download file **`AnimeStream.apk`** di bawah ini.
            2. Buka file `.apk` di HP Android Anda.
            3. Jika muncul peringatan *"Izinkan pemasangan dari sumber ini"*, pilih **Izinkan**.
            4. Klik **Install / Pasang**, lalu buka aplikasi!
          files: dist/AnimeStream.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
